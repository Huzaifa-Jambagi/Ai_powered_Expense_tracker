<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" fill="none">
  <defs>
    <linearGradient id="micFill" x1="145" y1="42" x2="218" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#5B36C8"/>
    </linearGradient>
    <linearGradient id="micHighlight" x1="153" y1="45" x2="177" y2="131" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave" x1="52" y1="94" x2="115" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B69AFB"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="softShadow" x="112" y="24" width="136" height="184" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Soft halo behind the microphone -->
  <circle cx="180" cy="105" r="82" fill="#A78BFA" fill-opacity=".08"/>
  <circle cx="180" cy="105" r="66" stroke="#A78BFA" stroke-opacity=".16" stroke-width="2"/>
  <circle cx="180" cy="105" r="53" fill="#C4B5FD" fill-opacity=".13"/>

  <!-- Left sound waves -->
  <g stroke="url(#wave)" stroke-linecap="round" stroke-width="5">
    <path d="M43 111V129"/>
    <path d="M56 99V141"/>
    <path d="M69 88V152"/>
    <path d="M82 101V139"/>
    <path d="M95 109V131"/>
    <path d="M108 116V124" opacity=".72"/>
  </g>
  <!-- Right sound waves -->
  <g stroke="#9B7AF0" stroke-linecap="round" stroke-width="5">
    <path d="M252 116V124" opacity=".72"/>
    <path d="M265 109V131"/>
    <path d="M278 101V139"/>
    <path d="M291 88V152"/>
    <path d="M304 99V141"/>
    <path d="M317 111V129"/>
  </g>

  <!-- Microphone shadow -->
  <ellipse cx="180" cy="184" rx="43" ry="9" fill="#4C2AA8" fill-opacity=".17" filter="url(#softShadow)"/>

  <!-- Microphone capsule -->
  <rect x="146" y="31" width="68" height="112" rx="34" fill="url(#micFill)"/>
  <path d="M151 65C151 47.327 165.327 33 183 33H185C194.598 33 202.375 40.777 202.375 50.375V113C202.375 126.255 191.63 137 178.375 137C163.26 137 151 124.74 151 109.625V65Z" fill="url(#micHighlight)"/>
  <path d="M161 58V111" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="4" stroke-linecap="round"/>

  <!-- Microphone grille -->
  <g stroke="#EDE9FE" stroke-opacity=".82" stroke-width="3.5" stroke-linecap="round">
    <path d="M160 76H200"/>
    <path d="M158 88H202"/>
    <path d="M158 100H202"/>
  </g>

  <!-- U-shaped holder -->
  <path d="M130 91V105C130 132.614 152.386 155 180 155C207.614 155 230 132.614 230 105V91" stroke="#6842CE" stroke-width="8" stroke-linecap="round"/>
  <path d="M130 104C130 132 152 154 180 154C208 154 230 132 230 104" stroke="#B9A2F4" stroke-width="3" stroke-linecap="round" opacity=".8"/>

  <!-- Stem and base -->
  <path d="M180 155V177" stroke="#6842CE" stroke-width="8" stroke-linecap="round"/>
  <path d="M157 185H203" stroke="#6842CE" stroke-width="8" stroke-linecap="round"/>
  <path d="M165 185H195" stroke="#B9A2F4" stroke-width="3" stroke-linecap="round"/>
</svg>
